name: Build & Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送镜像到 GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: true
      tag_name:
        description: '自定义镜像标签（留空默认使用 latest 及 commit sha）'
        required: false
        type: string
        default: 'latest'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'web/**'
      - 'scripts/**'
      - 'references/**'
      - 'resources/**'
      - 'skills/**'
      - '.github/workflows/docker-build.yml'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Cloud Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据（标签与镜像名）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true
            type=ref,event=tag
            type=raw,value=${{ inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && inputs.tag_name != 'latest' }}

      - name: 云端构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像构建完成通知
        run: |
          echo "================================================================"
          echo "  🎉 Docker 镜像云端构建与推送成功！"
          echo "  镜像名称: ghcr.io/${{ github.repository }}:latest"
          echo "  在服务器拉取并运行命令："
          echo "    docker pull ghcr.io/${{ github.repository }}:latest"
          echo "    docker compose pull && docker compose up -d"
          echo "================================================================"
