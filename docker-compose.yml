services:
  it-lesson-studio:
    image: ghcr.io/4724656/it-lesson-studio:latest
    build: .
    container_name: it-lesson-studio
    restart: unless-stopped
    ports:
      - "3800:3800"
    environment:
      - APP_MODE=team
    env_file:
      - ./web/.env
    volumes:
      - ./web/data:/app/web/data

